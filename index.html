<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Nexus AI — Live Web, Code & Sports Intelligence</title>
  <style>
    :root {
      --bg: #070b14;
      --sidebar-bg: #0c1220;
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --sports: #22c55e;
      --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
      --ai-bubble: rgba(30, 41, 59, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, var(--bg) 50%, #04070d 100%);
      color: var(--text);
    }

    body {
      display: flex;
      height: 100dvh;
    }

    /* Sidebar (Permanent Chat History) */
    aside#sidebar {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 30;
      flex-shrink: 0;
      min-height: 0;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #newChatBtn {
      flex: 1;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #newChatBtn:hover { background: rgba(56, 189, 248, 0.28); }

    #closeSidebarBtn {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .history-label {
      padding: 12px 16px 6px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #historyList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      transition: 0.15s;
      gap: 6px;
    }

    .history-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
    .history-item.active { background: rgba(56, 189, 248, 0.14); color: var(--accent); font-weight: 600; }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-mini-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.88rem;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      opacity: 0.75;
    }

    .icon-mini-btn:hover { color: var(--accent); background: rgba(56, 189, 248, 0.12); opacity: 1; }
    .icon-mini-btn.del:hover { color: #f87171; background: rgba(248, 113, 113, 0.12); }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }

    #clearAllBtn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #clearAllBtn:hover { border-color: #f87171; color: #f87171; }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 25;
      backdrop-filter: blur(2px);
    }

    /* Main Workspace */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #menuBtn {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .logo-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, .pill-toggle {
      background: rgba(15, 23, 42, 0.92);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
      white-space: nowrap;
    }

    select:hover, .pill-toggle:hover { border-color: var(--accent); }

    .pill-toggle.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--sports);
      color: #4ade80;
      font-weight: 600;
    }

    /* Chat Area */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 620px;
      padding: 20px 12px;
    }

    .welcome h1 {
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      background: linear-gradient(90deg, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-btn {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 18px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .suggestion-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Messages */
    .msg {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex-shrink: 0;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-items: flex-end; }
    .msg.ai { align-items: flex-start; }

    .bubble {
      padding: 15px 18px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
      height: auto;
      overflow: visible;
    }

    .msg.user .bubble {
      max-width: 82%;
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
    }

    .msg.ai .bubble {
      width: 100%;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      padding-left: 4px;
    }

    .copy-msg-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-msg-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Code Blocks with Copy Button */
    .code-wrapper {
      margin: 12px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: #060a12;
      white-space: normal;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .copy-code-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: none;
      transition: 0.2s;
    }

    .copy-code-btn:hover {
      background: rgba(56, 189, 248, 0.28);
    }

    .copy-code-btn.copied {
      background: rgba(34, 197, 94, 0.22);
      border-color: #22c55e;
      color: #86efac;
    }

    .code-wrapper pre {
      padding: 14px;
      overflow-x: auto;
      margin: 0;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #e2e8f0;
      white-space: pre;
    }

    .typing-cursor::after {
      content: "▍";
      color: var(--accent);
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Sources / Match Cards Strip */
    .sources-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .sources-title.sports-badge {
      color: #4ade80;
    }

    .sources-grid {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .source-card {
      min-width: 195px;
      max-width: 235px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      text-decoration: none;
      color: var(--text);
      transition: 0.2s;
      flex-shrink: 0;
    }

    .source-card:hover { border-color: var(--accent); background: rgba(30, 41, 59, 0.98); }

    .source-domain {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-name {
      font-size: 0.79rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 0.85rem;
      padding: 6px 10px;
      flex-shrink: 0;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom Input Bar */
    .input-area {
      flex-shrink: 0;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7, 11, 20, 0.98), rgba(7, 11, 20, 0.82));
    }

    .input-box {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 7px 8px 7px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    #micBtn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: 0.2s;
      flex-shrink: 0;
    }

    #micBtn:hover { color: var(--accent); border-color: var(--accent); }
    #micBtn.listening {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    button#sendBtn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    button#sendBtn:hover { opacity: 0.92; }
    button#sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 768px) {
      aside#sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }

      aside#sidebar.open { transform: translateX(0); }
      #sidebarOverlay.open { display: block; }
      #menuBtn, #closeSidebarBtn { display: inline-flex; align-items: center; justify-content: center; }

      .msg.user .bubble { max-width: 90%; }
      .bubble { padding: 13px 15px; font-size: 0.92rem; }
    }

    @media (max-width: 480px) {
      header { padding: 10px 12px; }
      .pill-toggle, select { padding: 6px 9px; font-size: 0.74rem; }
      button#sendBtn { padding: 9px 14px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="closeSidebarBtn" title="Close Menu">✕</button>
    </div>
    <div class="history-label">
      <span>Saved Chats</span>
      <span id="chatCountBadge">0</span>
    </div>
    <div id="historyList"></div>
    <div class="sidebar-footer">
      <button id="clearAllBtn">Clear All History</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header>
      <div class="header-left">
        <button id="menuBtn" title="Chat History">☰</button>
        <div class="brand">
          <div class="logo-dot"></div>
          <span>Nexus AI</span>
        </div>
      </div>
      <div class="controls">
        <button id="sportsToggle" class="pill-toggle" title="Force Flashscore Sports Intelligence">🏏 Live Sports</button>
        <select id="sportSelect" title="Select Specific Sport">
          <option value="auto" selected>Auto Sport</option>
          <option value="cricket">Cricket</option>
          <option value="football">Football</option>
          <option value="tennis">Tennis</option>
          <option value="basketball">Basketball</option>
          <option value="hockey">Hockey</option>
          <option value="badminton">Badminton</option>
        </select>
        <select id="freshnessSelect" title="Web Search Recency">
          <option value="" selected>Any Time</option>
          <option value="oneDay">Past 24 Hours</option>
          <option value="oneWeek">Past Week</option>
          <option value="oneMonth">Past Month</option>
        </select>
      </div>
    </header>

    <main id="chat"></main>

    <div class="input-area">
      <form class="input-box" id="chatForm">
        <input type="text" id="promptInput" placeholder="Ask about scores, scorecards, lineups, standings, code, or the web..." autocomplete="off" required />
        <button type="button" id="micBtn" title="Voice Input">🎤</button>
        <button type="submit" id="sendBtn">Ask AI</button>
      </form>
    </div>
  </div>

  <script>
    const LANGSEARCH_API_KEY = "sk-8312c802939e459ba348814af35a41b3";
    const LANGSEARCH_URL = "https://api.langsearch.com/v1/web-search";

    const FLASHSCORE_API_KEY = "ok_92db7785358099d92f49007ceb9d2de6";
    const FLASHSCORE_BASE_URL = "https://flashscore-scraper.omkar.cloud";

    const STORAGE_KEY = "nexus_ai_saved_chats";

    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const historyList = document.getElementById("historyList");
    const chatCountBadge = document.getElementById("chatCountBadge");
    const chat = document.getElementById("chat");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    const freshnessSelect = document.getElementById("freshnessSelect");
    const sportSelect = document.getElementById("sportSelect");
    const sportsToggle = document.getElementById("sportsToggle");

    let sportsMode = false;
    let sessions = loadAndMigrateSessions();
    let currentSessionId = sessions.length ? sessions[0].id : null;

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }
    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }
    menuBtn.addEventListener("click", openSidebar);
    closeSidebarBtn.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    sportsToggle.addEventListener("click", () => {
      sportsMode = !sportsMode;
      sportsToggle.classList.toggle("active", sportsMode);
    });

    sportSelect.addEventListener("change", () => {
      if (sportSelect.value !== "auto" && !sportsMode) {
        sportsMode = true;
        sportsToggle.classList.add("active");
      }
    });

    // Voice Input via Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {
        try {
          micBtn.classList.add("listening");
          recognition.start();
        } catch {
          micBtn.classList.remove("listening");
        }
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        promptInput.value = transcript;
        micBtn.classList.remove("listening");
        promptInput.focus();
      };

      recognition.onerror = () => micBtn.classList.remove("listening");
      recognition.onend = () => micBtn.classList.remove("listening");
    } else {
      micBtn.style.display = "none";
    }

    function loadAndMigrateSessions() {
      let current = [];
      try {
        current = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        current = [];
      }

      const legacyKeys = [
        "nexus_ai_sessions_v1",
        "nexus_ai_sessions_v2",
        "nexus_ai_sessions_v3",
        "nexus_ai_sessions_v4",
        "nexus_ai_sessions_v5",
        "nexus_ai_sessions_v6"
      ];

      const seenIds = new Set(current.map(s => s.id));
      let migrated = false;

      for (const oldKey of legacyKeys) {
        try {
          const oldData = JSON.parse(localStorage.getItem(oldKey));
          if (Array.isArray(oldData)) {
            for (const item of oldData) {
              if (item && item.id && !seenIds.has(item.id)) {
                current.push(item);
                seenIds.add(item.id);
                migrated = true;
              }
            }
          }
        } catch (_) {}
      }

      if (migrated) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
        } catch (_) {}
      }

      return current;
    }

    function saveSessions() {
      try {
        const compact = sessions.slice(0, 40).map(s => ({
          id: s.id,
          title: s.title,
          updatedAt: s.updatedAt,
          messages: s.messages.slice(-40).map(m => ({
            role: m.role,
            text: m.text,
            isSports: Boolean(m.isSports),
            sources: (m.sources || []).slice(0, 8).map(src => ({
              name: src.name || "",
              url: src.url || "",
              sub: src.sub || ""
            }))
          }))
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
      } catch (e) {

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderRichMarkdown(rawText) {
      const codeBlocks = [];
      const withPlaceholders = String(rawText).replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        const cleanLang = (lang || "code").trim();
        const trimmedCode = code.replace(/\n$/, "");
        codeBlocks.push({ lang: cleanLang, code: trimmedCode });
        return `@@CODE_BLOCK_${idx}@@`;
      });

      let html = escapeHtml(withPlaceholders)
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>")
        .replace(/`([^`]+)`/g, "<code style='background:rgba(0,0,0,0.4);padding:2px 6px;border-radius:5px;color:#7dd3fc;'>$1</code>");

      html = html.replace(/@@CODE_BLOCK_(\d+)@@/g, (_, idxStr) => {
        const block = codeBlocks[Number(idxStr)];
        if (!block) return "";
        const encodedCode = encodeURIComponent(block.code);
        return `
          <div class="code-wrapper">
            <div class="code-header">
              <span>${escapeHtml(block.lang)}</span>
              <button type="button" class="copy-code-btn" data-code="${encodedCode}" onclick="copyCodeBlock(this)">Copy Code</button>
            </div>
            <pre><code>${escapeHtml(block.code)}</code></pre>
          </div>
        `;
      });

      return html;
    }

    window.copyCodeBlock = function(btn) {
      const raw = decodeURIComponent(btn.getAttribute("data-code") || "");
      navigator.clipboard.writeText(raw).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy Code";
          btn.classList.remove("copied");
        }, 1800);
      });
    };

    function formatLocalTime(isoStr) {
      if (!isoStr) return "";
      try {
        const dt = new Date(isoStr);
        if (isNaN(dt.getTime())) return isoStr;
        return dt.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        });
      } catch {
        return isoStr;
      }
    }

    function typeWriterEffect(element, fullText, speed = 8) {
      return new Promise(resolve => {
        let index = 0;
        element.classList.add("typing-cursor");

        function step() {
          const chunk = Math.max(4, Math.ceil(fullText.length / 160));
          index = Math.min(index + chunk, fullText.length);
          element.innerHTML = renderRichMarkdown(fullText.slice(0, index));
          chat.scrollTop = chat.scrollHeight;

          if (index < fullText.length) {
            setTimeout(step, speed);
          } else {
            element.classList.remove("typing-cursor");
            element.innerHTML = renderRichMarkdown(fullText);
            chat.scrollTop = chat.scrollHeight;
            resolve();
          }
        }
        step();
      });
    }

    function detectSportType(query) {
      if (sportSelect.value !== "auto") return sportSelect.value;

    async function fsGet(path, headers) {
      try {
        const res = await fetch(`${FLASHSCORE_BASE_URL}${path}`, { headers });

    // FIX 1: Extract Flashscore 8-char ID from ent.id OR from ent.link URL path
    function extractEntityId(ent) {
      if (!ent) return null;
      const directId = ent.id || ent.team_id || ent.player_id || ent.tournament_id || ent.match_id;
      if (directId && String(directId).length >= 6) return String(directId);

      if (ent.link) {
        const parts = String(ent.link).split("/").filter(Boolean);
        // Flashscore URLs end with the 8-char alphanumeric ID (e.g., /team/real-madrid/W8mj7MDD/)
        for (let i = parts.length - 1; i >= 0; i--) {
          if (/^[A-Za-z0-9]{8}$/.test(parts[i])) {
            return parts[i];
          }
        }
      }
      return null;
    }

    // FIX 2: Cleanly strip null/empty values and format JSON into readable lines
    function cleanJsonToReadable(obj, maxLines = 18) {
      if (!obj) return "";
      const lines = [];

      function walk(node, prefix = "") {
        if (lines.length >= maxLines || node === null || node === undefined || node === "") return;
        if (Array.isArray(node)) {
          node.slice(0, 12).forEach((item, idx) => {
            if (typeof item === "object" && item !== null) {
              const summaryParts = [];
              for (const [k, v] of Object.entries(item)) {
                if (v === null || v === undefined || v === "" || k.includes("link") || k.includes("image") || k.includes("logo") || k === "id") continue;
                if (typeof v === "object") {
                  const nestedName = v.name || v.display_name || v.score || "";
                  if (nestedName) summaryParts.push(`${k}: ${nestedName}`);
                } else {
                  summaryParts.push(`${k}: ${v}`);
                }
              }
              if (summaryParts.length) lines.push(`  • ${summaryParts.slice(0, 6).join(" | ")}`);
            } else if (item !== null && item !== "") {
              lines.push(`  • ${item}`);
            }
          });
          return;
        }
        if (typeof node === "object") {
          for (const [k, v] of Object.entries(node)) {
            if (lines.length >= maxLines) break;
            if (v === null || v === undefined || v === "" || k.includes("link") || k.includes("image") || k.includes("logo") || k === "available_tabs") continue;
            if (typeof v === "object") {
              walk(v, prefix ? `${prefix}.${k}` : k);
            } else {
              const label = k.replace(/_/g, " ");
              lines.push(`  • ${label}: ${v}`);
            }
          }
        }
      }

      walk(obj);
      return lines.join("\n");
    }

    // FIX 3: Score competition importance so major leagues appear first instead of alphabetical countries
    function getCompetitionPriority(compName, searchTerms) {
      const lower = (compName || "").toLowerCase();
      let score = 0;

      // Exact query keyword match gets highest priority
      if (searchTerms.some(t => lower.includes(t.toLowerCase()))) score += 100;

      // Major global leagues & tournaments
      const majorKeywords = [
        "premier league", "champions league", "europa league", "laliga", "la liga",
        "serie a", "bundesliga", "ligue 1", "world cup", "icc", "ipl", "indian premier league",
        "big bash", "sheffield shield", "ashes", "test", "odi", "t20", "nba", "atp", "wta", "grand slam"
      ];
      if (majorKeywords.some(m => lower.includes(m))) score += 40;

      return score;
    }

    function extractSearchTerms(query) {
      const aliasMap = {
        ind: "India",
        nz: "New Zealand",
        aus: "Australia",
        eng: "England",
        pak: "Pakistan",
        sa: "South Africa",
        sl: "Sri Lanka",
        ban: "Bangladesh",
        wi: "West Indies",
        afg: "Afghanistan",
        wa: "Western Australia"
      };

      const stop = new Set([
        "give", "the", "scorecard", "score", "scores", "of", "that", "it", "is", "running", "currently",
        "live", "match", "matches", "today", "latest", "results", "fixtures", "upcoming", "and", "or",
        "for", "in", "on", "with", "stats", "statistics", "lineup", "lineups", "squad", "standings",
        "table", "points", "h2h", "head", "to", "odds", "commentary", "news", "details", "summary",
        "1st", "2nd", "3rd", "4th", "5th", "test", "odi", "t20", "series", "cricket", "football",
        "tennis", "basketball", "please", "show", "me", "what", "are", "full", "top", "scorers",
        "profile", "career", "headlines", "rankings", "official"
      ]);

      const rawWords = query.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
      const terms = [];

      for (const w of rawWords) {
        if (aliasMap[w]) {
          terms.push(aliasMap[w]);
        } else if (w.length > 2 && !stop.has(w)) {
          terms.push(w);
        }
      }
      return terms;
    }

    // Check available_tabs first and parse match details cleanly without raw JSON or null dumps
    async function enrichMatchById(matchId, userQuery, headers, availableTabs = null) {
      const q = userQuery.toLowerCase();
      const blocks = [];

      const details = await fsGet(`/matches/details?match_id=${encodeURIComponent(matchId)}`, headers);
      const tabs = Array.isArray(details?.available_tabs)
        ? details.available_tabs
        : (Array.isArray(availableTabs) ? availableTabs : null);

      if (details) {
        const cleanDetails = cleanJsonToReadable(details, 10);
        if (cleanDetails) blocks.push(`  **Match Details:**\n${cleanDetails}`);
      }

      const canCall = (tabName) => !tabs || tabs.includes(tabName);
      const tasks = [];

      if (canCall("summary")) {
        tasks.push(fsGet(`/matches/summary?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Match Summary & Scorecard Events", d })));
      }
      if (canCall("statistics") && /\b(scorecard|stat|stats|statistics|xg|possession|shots|detail|details)\b/.test(q)) {
        tasks.push(fsGet(`/matches/statistics?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Match Statistics", d })));
      }
      if (canCall("player_statistics") && /\b(scorecard|player|stat|stats|statistics|batting|bowling)\b/.test(q)) {
        tasks.push(fsGet(`/matches/player-statistics?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Player Scorecard Stats", d })));
      }
      if (canCall("lineups") && /\b(scorecard|lineup|lineups|xi|playing|squad|starting|bench)\b/.test(q)) {
        tasks.push(fsGet(`/matches/lineups?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Lineups & Playing XI", d })));
      }
      if (canCall("commentary") && /\b(commentary|ball|minute|live|scorecard)\b/.test(q)) {
        tasks.push(fsGet(`/matches/commentary?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Live Commentary", d })));
      }
      if (canCall("h2h") && /\b(h2h|head to head|history)\b/.test(q)) {
        tasks.push(fsGet(`/matches/h2h?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Head-to-Head", d })));
      }
      if (canCall("standings") && /\b(standings|table|points)\b/.test(q)) {
        tasks.push(fsGet(`/matches/standings?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Competition Standings", d })));
      }
      if (canCall("odds") && /\b(odds|betting|price)\b/.test(q)) {
        tasks.push(fsGet(`/matches/odds?match_id=${encodeURIComponent(matchId)}`, headers).then(d => ({ key: "Match Odds", d })));
      }

      const settled = await Promise.all(tasks);
      for (const item of settled) {
        if (!item.d) continue;
        const readable = cleanJsonToReadable(item.d, 14);
        if (readable) {
          blocks.push(`  **${item.key}:**\n${readable}`);
        }
      }

      return blocks.join("\n");
    }

    async function fetchComprehensiveSportsData(userQuery, statusEl) {
      const sport = detectSportType(userQuery);
      const q = userQuery.toLowerCase();
      const headers = {
        "API-Key": FLASHSCORE_API_KEY,
        "Accept": "application/json"
      };

      const cards = [];
      const contextChunks = [];
      let foundSpecificEntityMatch = false;

      // A. Rankings (ATP / WTA)
      if (/\b(rankings|ranking|atp|wta)\b/.test(q)) {
        statusEl.querySelector("span").textContent = "Fetching official rankings from Flashscore...";
        const rankData = await fsGet(`/rankings/data?sport=${sport}`, headers) || await fsGet(`/rankings`, headers);
        const readableRank = cleanJsonToReadable(rankData, 20);
        if (readableRank) {
          contextChunks.push(`**${sport.toUpperCase()} Official Rankings:**\n${readableRank}`);
          cards.push({
            name: `${sport.toUpperCase()} Official Rankings`,
            sub: "Flashscore Rankings",
            url: "https://www.flashscore.com/tennis/rankings/",
            text: ""
          });
          foundSpecificEntityMatch = true;
        }
      }

      // B. Sports News
      if (/\b(news|headlines|transfer|transfers|article)\b/.test(q)) {
        statusEl.querySelector("span").textContent = `Fetching latest ${sport} news from Flashscore...`;
        const newsData = await fsGet(`/news?sport=${sport}`, headers);
        const items = Array.isArray(newsData) ? newsData : (newsData?.articles || newsData?.news || []);
        if (items.length) {
          const newsLines = items.slice(0, 6).map(n => {
            const title = n.title || n.headline || "Headline";
            const summary = n.summary || n.description || "";
            cards.push({
              name: title,
              sub: `${sport.toUpperCase()} News`,
              url: n.link || n.url || "https://www.flashscore.com/news/",
              text: ""
            });
            return `• **${title}**${summary ? " — " + summary : ""}`;
          }).join("\n");
          contextChunks.push(`**Latest ${sport.toUpperCase()} News:**\n${newsLines}`);
          foundSpecificEntityMatch = true;
        }
      }

      // C. Search Teams, Players, or Competitions (strictly filtered by sport & multi-word phrase)
      const searchTerms = extractSearchTerms(userQuery);
      let foundMatchesFromSearch = [];

      if (searchTerms.length > 0) {
        // Group consecutive capitalized or non-stop words into a clean entity phrase (e.g., "Premier League", "Real Madrid", "Virat Kohli")
        const searchPhrase = searchTerms.slice(0, 3).join(" ");
        statusEl.querySelector("span").textContent = `Searching Flashscore (${sport}) for "${searchPhrase}"...`;

        const searchRes = await fsGet(`/search?query=${encodeURIComponent(searchPhrase)}&sport=${encodeURIComponent(sport)}`, headers);
        let rawEntities = Array.isArray(searchRes)
          ? searchRes
          : (searchRes?.results || searchRes?.items || searchRes?.teams || []);

        // Strictly filter out entities from the wrong sport (e.g., block tennis players when sport === "cricket")
        const filteredEntities = rawEntities.filter(ent => {
          const entSport = (ent.sport || ent.sport_name || "").toLowerCase();
          if (entSport && entSport !== sport) return false;
          return true;
        });

        for (const ent of filteredEntities.slice(0, 2)) {
          const entId = extractEntityId(ent);
          const entName = ent.name || ent.display_name || searchPhrase;
          const entType = (ent.type || ent.entity_type || "").toLowerCase();

          if (!entId) continue;

          if (entType.includes("player")) {
            statusEl.querySelector("span").textContent = `Fetching player profile & stats for ${entName}...`;
            const [pDet, pCar, pInj] = await Promise.all([
              fsGet(`/players/details?player_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/players/career?player_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/players/injuries?player_id=${encodeURIComponent(entId)}`, headers)
            ]);
            const pSections = [];
            if (pDet) pSections.push(`**Profile:**\n${cleanJsonToReadable(pDet, 10)}`);
            if (pCar) pSections.push(`**Career Stats:**\n${cleanJsonToReadable(pCar, 10)}`);
            if (pInj) pSections.push(`**Injury History:**\n${cleanJsonToReadable(pInj, 6)}`);

            if (pSections.length) {
              contextChunks.push(`**Player Report — ${entName}:**\n${pSections.join("\n")}`);
              cards.push({
                name: entName,
                sub: "Player Profile & Career",
                url: ent.link || "https://www.flashscore.com/",
                text: ""
              });
              foundSpecificEntityMatch = true;
            }
          } else if (entType.includes("tournament") || entType.includes("competition") || entType.includes("league")) {
            statusEl.querySelector("span").textContent = `Fetching ${entName} standings, top scorers & fixtures...`;
            const [tStand, tRes, tFix, tScorers] = await Promise.all([
              fsGet(`/tournaments/standings?tournament_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/tournaments/results?tournament_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/tournaments/fixtures?tournament_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/tournaments/top-scorers?tournament_id=${encodeURIComponent(entId)}`, headers)
            ]);

            const tSections = [];
            if (tStand) tSections.push(`**Standings / Table:**\n${cleanJsonToReadable(tStand, 15)}`);
            if (tScorers) tSections.push(`**Top Scorers:**\n${cleanJsonToReadable(tScorers, 10)}`);
            if (tRes) tSections.push(`**Recent Results:**\n${cleanJsonToReadable(tRes, 8)}`);
            if (tFix) tSections.push(`**Upcoming Fixtures:**\n${cleanJsonToReadable(tFix, 8)}`);

            if (tSections.length) {
              contextChunks.push(`**Tournament Report — ${entName}:**\n${tSections.join("\n\n")}`);
              cards.push({
                name: entName,
                sub: "Table, Scorers & Fixtures",
                url: ent.link || "https://www.flashscore.com/",
                text: ""
              });
              foundSpecificEntityMatch = true;
            }
          } else {
            // Team entity
            statusEl.querySelector("span").textContent = `Fetching matches, results & squad for ${entName}...`;
            const wantsSquad = /\b(squad|players|roster|lineup|lineups|xi)\b/.test(q);
            const wantsTable = /\b(standings|table|points)\b/.test(q);

            const [teamResults, teamFixtures, teamSquad, teamStandings] = await Promise.all([
              fsGet(`/teams/results?team_id=${encodeURIComponent(entId)}`, headers),
              fsGet(`/teams/fixtures?team_id=${encodeURIComponent(entId)}`, headers),
              wantsSquad ? fsGet(`/teams/squad?team_id=${encodeURIComponent(entId)}`, headers) : Promise.resolve(null),
              wantsTable ? fsGet(`/teams/standings?team_id=${encodeURIComponent(entId)}`, headers) : Promise.resolve(null)
            ]);

            const resList = Array.isArray(teamResults) ? teamResults : (teamResults?.matches || teamResults?.results || []);
            const fixList = Array.isArray(teamFixtures) ? teamFixtures : (teamFixtures?.matches || teamFixtures?.fixtures || []);

            for (const m of [...resList.slice(0, 4), ...fixList.slice(0, 4)]) {
              const home = m.home?.name || m.home_name || "Home";
              const away = m.away?.name || m.away_name || "Away";
              const hScore = m.home_score ?? "-";
              const aScore = m.away_score ?? "-";
              const stage = m.stage || m.status || "";
              const comp = m.competition?.name || entName;
              const localTime = formatLocalTime(m.start_time);

              const matchObj = {
                id: extractEntityId(m) || m.id,
                availableTabs: m.available_tabs || null,
                name: `${home} ${hScore} - ${aScore} ${away}`,
                sub: `${comp} • ${stage}${localTime ? " • " + localTime : ""}`,
                url: m.link || ent.link || "https://www.flashscore.com/",
                text: `• **${home} (${hScore}) vs ${away} (${aScore})** — *${comp}* | Status: **${stage}**${localTime ? " | Start: " + localTime : ""}`
              };
              foundMatchesFromSearch.push(matchObj);
              cards.push(matchObj);
              foundSpecificEntityMatch = true;
            }

            if (teamSquad) {
              const cleanSquad = cleanJsonToReadable(teamSquad, 18);
              if (cleanSquad) {
                contextChunks.push(`**${entName} Squad:**\n${cleanSquad}`);
                foundSpecificEntityMatch = true;
              }
            }
            if (teamStandings) {
              const cleanTable = cleanJsonToReadable(teamStandings, 12);
              if (cleanTable) {
                contextChunks.push(`**${entName} Standings:**\n${cleanTable}`);
                foundSpecificEntityMatch = true;
              }
            }
          }
        }
      }

      // D. Live Matches & Today's Matches (Prioritizing Major Leagues & Matching Teams)
      statusEl.querySelector("span").textContent = `Checking live ${sport} scoreboard on Flashscore...`;
      let dayData = await fsGet(`/matches/live?sport=${sport}`, headers);
      let isLiveOnly = true;
      if (!dayData || !dayData.match_count) {
        dayData = await fsGet(`/matches?sport=${sport}&day=0`, headers);
        isLiveOnly = false;
      }

      const competitions = dayData?.competitions || [];
      const dayMatches = [];

      for (const compBlock of competitions) {
        const compName = compBlock.competition?.display_name || compBlock.competition?.name || sport.toUpperCase();
        const compLink = compBlock.competition?.link || "https://www.flashscore.com/";
        const compScore = getCompetitionPriority(compName, searchTerms);

        for (const m of (compBlock.matches || [])) {
          const home = m.home?.name || "Home";
          const away = m.away?.name || "Away";
          const hScore = m.home_score ?? "-";
          const aScore = m.away_score ?? "-";
          const stage = m.stage || m.status || "Scheduled";
          const localTime = formatLocalTime(m.start_time);

          let periodDetails = "";
          if (m.home_period_scores && m.away_period_scores) {
            const hP = Array.isArray(m.home_period_scores) ? m.home_period_scores.join(", ") : JSON.stringify(m.home_period_scores);
            const aP = Array.isArray(m.away_period_scores) ? m.away_period_scores.join(", ") : JSON.stringify(m.away_period_scores);
            periodDetails = `\n  Innings/Periods: ${home} [${hP}] vs ${away} [${aP}]`;
          }

          const searchBlob = `${compName} ${home} ${away}`.toLowerCase();
          const teamMatchBoost = searchTerms.some(k => searchBlob.includes(k.toLowerCase())) ? 150 : 0;
          if (teamMatchBoost > 0) foundSpecificEntityMatch = true;

          dayMatches.push({
            id: extractEntityId(m) || m.id,
            availableTabs: m.available_tabs || null,
            priority: compScore + teamMatchBoost + (isLiveOnly ? 50 : 0),
            name: `${home} ${hScore} - ${aScore} ${away}`,
            sub: `${compName} • ${stage}${localTime ? " • " + localTime : ""}`,
            url: m.link || compLink,
            text: `• **${home} (${hScore}) vs ${away} (${aScore})** — *${compName}*\n  Status: **${stage}**${localTime ? " | Start: " + localTime : ""}${periodDetails}`
          });
        }
      }

      dayMatches.sort((a, b) => b.priority - a.priority);

      const combinedMatches = [...foundMatchesFromSearch];
      const seenIds = new Set(combinedMatches.map(m => m.id).filter(Boolean));
      for (const dm of dayMatches) {
        if (!dm.id || !seenIds.has(dm.id)) {
          combinedMatches.push(dm);
          if (dm.id) seenIds.add(dm.id);
        }
      }

      // E. Enrich top relevant match with full scorecard/summary/stats/lineups whenever requested
      const topMatches = combinedMatches.slice(0, 10);
      const wantsDeepMatch = /\b(scorecard|detail|details|stat|stats|statistics|summary|lineup|lineups|commentary|h2h|odds)\b/.test(q);
      if (topMatches.length > 0 && topMatches[0].id && (foundSpecificEntityMatch || wantsDeepMatch)) {
        statusEl.querySelector("span").textContent = `Loading detailed scorecard & stats for ${topMatches[0].name}...`;
        const deepInfo = await enrichMatchById(topMatches[0].id, userQuery, headers, topMatches[0].availableTabs);
        if (deepInfo) {
          topMatches[0].text += `\n${deepInfo}`;
        }
      }

      const finalCards = cards.length ? cards.slice(0, 10) : topMatches.slice(0, 10);
      if (topMatches.length) {
        contextChunks.unshift(
          `**${isLiveOnly ? "Live" : "Today's"} ${sport.toUpperCase()} Matches & Scorecards:**\n\n` +
          topMatches.map(m => m.text).join("\n\n")
        );
      }

      // F. Broad Hybrid Sports Web Backup when Flashscore doesn't cover a requested series/league
      if (searchTerms.length > 0 && !foundSpecificEntityMatch) {
        statusEl.querySelector("span").textContent = `Searching live sports scorecard & series archives...`;
        try {
          const webSports = await searchLangSearch(`${userQuery} scorecard standings stats schedule`, "", null);
          if (webSports.length) {
            const webSnippetBlock = webSports.slice(0, 4).map((r, idx) => {
              const body = (r.text || r.snippet || "").replace(/\s+/g, " ").trim().slice(0, 1000);
              finalCards.unshift({
                name: r.name,
                sub: "Live Sports Web Source",
                url: r.url
              });
              return `• **${r.name}**\n  ${body}`;
            }).join("\n\n");
            contextChunks.unshift(`**Live Sports Web Report:**\n\n${webSnippetBlock}`);
          }
        } catch (_) {}
      }

      return {
        sport,
        cards: finalCards.slice(0, 10),
        contextText: contextChunks.join("\n\n---\n\n")
      };
    }

    async function searchLangSearch(query, overrideFreshness = null, includeDomains = null) {
      const payload = {
        query,
        count: 6,
        contents: {
          text: { max_characters: 2800 }
        }
      };

      const fresh = overrideFreshness !== null ? overrideFreshness : freshnessSelect.value;
      if (fresh) payload.freshness = fresh;
      if (includeDomains && includeDomains.length) payload.includeDomains = includeDomains;

      const res = await fetch(LANGSEARCH_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${LANGSEARCH_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`LangSearch API error (${res.status}): ${errText}`);
      }

      const data = await res.json();
      return data?.data?.webPages?.value || [];
    }

    async function generateGroundedAnswer(userQuery, payloadData, isSports, recentHistory = []) {
      let context = "";
      if (isSports) {
        context = payloadData.contextText;
        if (!context) {
          return `No matching **${payloadData.sport}** fixtures, results, or stats were returned right now. Try specifying a team, tournament, or sport name.`;
        }
      } else {
        const results = payloadData;
        if (!results.length) {
          return "No live web results were found for that query. Try switching the time filter to **Any Time**.";
        }
        context = results.map((r, i) => {
          const body = (r.text || r.snippet || "").replace(/\s+/g, " ").trim().slice(0, 950);
          return `[${i + 1}] ${r.name}: ${body}`;
        }).join("\n");
      }

      const systemPrompt = isSports
        ? "You are Nexus AI, a complete sports intelligence assistant. Answer thoroughly using ONLY the provided Flashscore & live sports data. Include exact scores, innings/period breakdowns, match status, local start times, full batting/bowling or match statistics, lineups, standings, H2H, odds, or news as requested. Use clean bullet points and **bold** headings. Never cut off mid-sentence."
        : "You are Nexus AI, a live web search & coding assistant. Answer clearly and completely using the provided live search results (and your coding knowledge when asked to write code). Wrap all code snippets in triple backticks ```language so the user gets a copy button. Use clean bullet points and **bold** highlights.";

      const historyMessages = recentHistory.slice(-4).map(m => ({
        role: m.role === "ai" ? "assistant" : "user",
        content: m.text.slice(0, 800)
      }));

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 16000);
        const res = await fetch("[https://text.pollinations.ai/openai](https://text.pollinations.ai/openai)", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            model: "openai",
            messages: [
              { role: "system", content: systemPrompt },
              ...historyMessages,
              { role: "user", content: `Question: ${userQuery}\n\nData:\n${context.slice(0, 6000)}` }
            ]
          })
        });
        clearTimeout(timer);

        if (res.ok) {
          const json = await res.json();
          const reply = json?.choices?.[0]?.message?.content?.trim();
          if (reply) return reply;
        }
      } catch (_) {}

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 14000);
        const shortPrompt = `${systemPrompt}\n\nQuestion: ${userQuery}\n\nData:\n${context.slice(0, 2200)}`;
        const getRes = await fetch(`[https://text.pollinations.ai/$](https://text.pollinations.ai/$){encodeURIComponent(shortPrompt)}`, {
          signal: controller.signal
        });
        clearTimeout(timer);
        if (getRes.ok) {
          const text = (await getRes.text()).trim();
          if (text && !text.startsWith("<!DOCTYPE") && !text.startsWith("{")) return text;
        }
      } catch (_) {}

      // Clean pre-formatted fallback (already stripped of null/raw JSON)
      if (isSports) {
        return context.slice(0, 4200);
      }

      return `**Live Web Results for "${userQuery}":**\n\n` +
        payloadData.slice(0, 5).map(r => {
          const clean = (r.snippet || r.text || "").replace(/\s+/g, " ").trim();
          return `• **${r.name}**\n  ${clean}`;
        }).join("\n\n");
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = promptInput.value.trim();
      if (!query) return;

      let session = getCurrentSession();
      if (!session) {
        session = createNewSession(query);
      } else if (session.messages.length === 0) {
        session.title = query.slice(0, 42);
      }

      const priorHistory = [...session.messages];

      promptInput.value = "";
      sendBtn.disabled = true;

      session.messages.push({ role: "user", text: query });
      session.updatedAt = Date.now();
      saveSessions();
      renderSidebar();
      await appendMessageElement("user", query, [], false);

      if (/^(hi|hello|hey|namaste|good morning|good evening|who are you|what is your name)[!?. ]*$/i.test(query)) {
        const greetingReply = "Hello! I'm **Nexus AI**. Ask me anything about **live scores, full scorecards, lineups, standings, player stats, or fixtures** (powered by Flashscore), ask me to **write code** (with one-click copy buttons), or ask any **real-time web question** (powered by LangSearch).";
        session.messages.push({ role: "ai", text: greetingReply, sources: [], isSports: false });
        saveSessions();
        await appendMessageElement("ai", greetingReply, [], true, false);
        sendBtn.disabled = false;
        promptInput.focus();
        return;
      }

      const isSports = detectSportsQuery(query);
      const statusEl = createStatus(
        isSports
          ? "Connecting to Flashscore Sports API..."
          : "Searching live web via LangSearch..."
      );

      try {
        let slimSources = [];
        let answer = "";

        if (isSports) {
          const sportsReport = await fetchComprehensiveSportsData(query, statusEl);
          statusEl.querySelector("span").textContent = "Synthesizing complete sports report...";
          answer = await generateGroundedAnswer(query, sportsReport, true, priorHistory);
          slimSources = sportsReport.cards.map(c => ({
            name: c.name,
            url: c.url,
            sub: c.sub || ""
          }));
        } else {
          const webResults = await searchLangSearch(query);
          statusEl.querySelector("span").textContent = `Synthesizing ${webResults.length} web sources...`;
          answer = await generateGroundedAnswer(query, webResults, false, priorHistory);
          slimSources = webResults.map(r => ({
            name: r.name,
            url: r.url,
            sub: ""
          }));
        }

        statusEl.remove();

        session.messages.push({ role: "ai", text: answer, sources: slimSources, isSports });
        session.updatedAt = Date.now();
        saveSessions();
        renderSidebar();

        await appendMessageElement("ai", answer, slimSources, true, isSports);
      } catch (err) {
        statusEl.remove();
        const errorMsg = `⚠️ **Request Failed:** ${err.message}`;
        session.messages.push({ role: "ai", text: errorMsg, sources: [] });
        saveSessions();
        await appendMessageElement("ai", errorMsg, [], true);
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });

    renderSidebar();
    renderActiveChat();
  </script>
</body>
