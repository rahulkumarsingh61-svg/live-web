<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Nexus AI — Live Web & Sports Assistant</title>
  <style>
    :root {
      --bg: #070b14;
      --sidebar-bg: #0c1220;
      --panel: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --sports: #22c55e;
      --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
      --ai-bubble: rgba(30, 41, 59, 0.86);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, var(--bg) 50%, #04070d 100%);
      color: var(--text);
    }

    body {
      display: flex;
      height: 100dvh;
    }

    /* Sidebar (Chat History) */
    aside#sidebar {
      width: 265px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 30;
      flex-shrink: 0;
      min-height: 0;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #newChatBtn {
      flex: 1;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #newChatBtn:hover { background: rgba(56, 189, 248, 0.28); }

    #closeSidebarBtn {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .history-label {
      padding: 12px 16px 6px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      font-weight: 600;
    }

    #historyList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      transition: 0.15s;
      gap: 8px;
    }

    .history-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
    .history-item.active { background: rgba(56, 189, 248, 0.14); color: var(--accent); font-weight: 600; }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 6px;
      opacity: 0.7;
    }

    .delete-chat-btn:hover { color: #f87171; background: rgba(248, 113, 113, 0.12); opacity: 1; }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }

    #clearAllBtn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    #clearAllBtn:hover { border-color: #f87171; color: #f87171; }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 25;
      backdrop-filter: blur(2px);
    }

    /* Main Workspace */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #menuBtn {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .logo-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    select, .pill-toggle {
      background: rgba(15, 23, 42, 0.92);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
      white-space: nowrap;
    }

    select:hover, .pill-toggle:hover { border-color: var(--accent); }

    .pill-toggle.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--sports);
      color: #4ade80;
      font-weight: 600;
    }

    /* Scrollable Chat Area */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 560px;
      padding: 20px 12px;
    }

    .welcome h1 {
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      background: linear-gradient(90deg, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-btn {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 18px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .suggestion-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Messages */
    .msg {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex-shrink: 0;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-items: flex-end; }
    .msg.ai { align-items: flex-start; }

    .bubble {
      padding: 15px 18px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
      height: auto;
      overflow: visible;
    }

    .msg.user .bubble {
      max-width: 82%;
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
    }

    .msg.ai .bubble {
      width: 100%;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
    }

    .typing-cursor::after {
      content: "▍";
      color: var(--accent);
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Sources / Match Cards Strip */
    .sources-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .sources-title.sports-badge {
      color: #4ade80;
    }

    .sources-grid {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .source-card {
      min-width: 185px;
      max-width: 225px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      text-decoration: none;
      color: var(--text);
      transition: 0.2s;
      flex-shrink: 0;
    }

    .source-card:hover { border-color: var(--accent); background: rgba(30, 41, 59, 0.98); }

    .source-domain {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-name {
      font-size: 0.79rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 0.85rem;
      padding: 6px 10px;
      flex-shrink: 0;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom Input Bar */
    .input-area {
      flex-shrink: 0;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7, 11, 20, 0.98), rgba(7, 11, 20, 0.82));
    }

    .input-box {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 7px 8px 7px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    button#sendBtn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    button#sendBtn:hover { opacity: 0.92; }
    button#sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Responsive Breakpoints */
    @media (max-width: 768px) {
      aside#sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }

      aside#sidebar.open { transform: translateX(0); }
      #sidebarOverlay.open { display: block; }
      #menuBtn, #closeSidebarBtn { display: inline-flex; align-items: center; justify-content: center; }

      .msg.user .bubble { max-width: 90%; }
      .bubble { padding: 13px 15px; font-size: 0.92rem; }
    }

    @media (max-width: 440px) {
      header { padding: 10px 12px; }
      .pill-toggle, select { padding: 6px 10px; font-size: 0.76rem; }
      button#sendBtn { padding: 9px 14px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="closeSidebarBtn" title="Close Menu">✕</button>
    </div>
    <div class="history-label">Saved Chats</div>
    <div id="historyList"></div>
    <div class="sidebar-footer">
      <button id="clearAllBtn">Clear All History</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header>
      <div class="header-left">
        <button id="menuBtn" title="Chat History">☰</button>
        <div class="brand">
          <div class="logo-dot"></div>
          <span>Nexus AI</span>
        </div>
      </div>
      <div class="controls">
        <button id="sportsToggle" class="pill-toggle" title="Force Flashscore Live Sports API">🏏 Live Sports</button>
        <select id="freshnessSelect" title="Web Search Recency">
          <option value="">Any Time</option>
          <option value="oneDay">Past 24 Hours</option>
          <option value="oneWeek" selected>Past Week</option>
          <option value="oneMonth">Past Month</option>
        </select>
      </div>
    </header>

    <main id="chat"></main>

    <div class="input-area">
      <form class="input-box" id="chatForm">
        <input type="text" id="promptInput" placeholder="Ask about live cricket/football scores or anything on the web..." autocomplete="off" required />
        <button type="submit" id="sendBtn">Ask AI</button>
      </form>
    </div>
  </div>

  <script>
    // 1. General Web Search API (LangSearch)
    const LANGSEARCH_API_KEY = "sk-8312c802939e459ba348814af35a41b3";
    const LANGSEARCH_URL = "https://api.langsearch.com/v1/web-search";

    // 2. Live Sports API (Omkar Flashscore Scraper)
    const FLASHSCORE_API_KEY = "ok_92db7785358099d92f49007ceb9d2de6";
    const FLASHSCORE_BASE_URL = "https://flashscore-scraper.omkar.cloud";

    const STORAGE_KEY = "nexus_ai_sessions_v3";

    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const historyList = document.getElementById("historyList");
    const chat = document.getElementById("chat");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const freshnessSelect = document.getElementById("freshnessSelect");
    const sportsToggle = document.getElementById("sportsToggle");

    let sportsMode = false;
    let sessions = loadSessions();
    let currentSessionId = sessions.length ? sessions[0].id : null;

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }
    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }
    menuBtn.addEventListener("click", openSidebar);
    closeSidebarBtn.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    sportsToggle.addEventListener("click", () => {
      sportsMode = !sportsMode;
      sportsToggle.classList.toggle("active", sportsMode);
    });

    function loadSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveSessions() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      } catch (e) {
        console.warn("Storage limit reached:", e);
      }
    }

    function createNewSession(firstTitle = "New Chat") {
      const id = "chat_" + Date.now();
      const session = {
        id,
        title: firstTitle.slice(0, 42),
        updatedAt: Date.now(),
        messages: []
      };
      sessions.unshift(session);
      currentSessionId = id;
      saveSessions();
      renderSidebar();
      renderActiveChat();
      closeSidebar();
      return session;
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentSessionId) || null;
    }

    newChatBtn.addEventListener("click", () => {
      currentSessionId = null;
      renderSidebar();
      renderActiveChat();
      closeSidebar();
      promptInput.focus();
    });

    clearAllBtn.addEventListener("click", () => {
      if (!sessions.length) return;
      if (confirm("Delete all saved chats permanently?")) {
        sessions = [];
        currentSessionId = null;
        saveSessions();
        renderSidebar();
        renderActiveChat();
      }
    });

    function deleteSession(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (currentSessionId === id) {
        currentSessionId = sessions.length ? sessions[0].id : null;
      }
      saveSessions();
      renderSidebar();
      renderActiveChat();
    }

    function renderSidebar() {
      historyList.innerHTML = "";
      if (!sessions.length) {
        historyList.innerHTML = `<div style="padding:12px;color:var(--muted);font-size:0.82rem;">No saved chats yet.</div>`;
        return;
      }

      sessions.forEach(s => {
        const item = document.createElement("div");
        item.className = "history-item" + (s.id === currentSessionId ? " active" : "");
        item.onclick = () => {
          currentSessionId = s.id;
          renderSidebar();
          renderActiveChat();
          closeSidebar();
        };

        const titleSpan = document.createElement("span");
        titleSpan.className = "history-title";
        titleSpan.textContent = s.title;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-chat-btn";
        delBtn.title = "Delete chat";
        delBtn.textContent = "🗑";
        delBtn.onclick = (e) => deleteSession(s.id, e);

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        historyList.appendChild(item);
      });
    }

    function renderActiveChat() {
      chat.innerHTML = "";
      const session = getCurrentSession();

      if (!session || !session.messages.length) {
        chat.innerHTML = `
          <div class="welcome" id="welcomeScreen">
            <h1>Ask Anything, Grounded Live</h1>
            <p>Automatically uses <strong>Flashscore Live Sports API</strong> for any cricket, football, or sports question, and <strong>LangSearch Web API</strong> for everything else.</p>
            <div class="suggestions">
              <button class="suggestion-btn" onclick="quickAsk('Live cricket match scores today')">🏏 Live cricket scores</button>
              <button class="suggestion-btn" onclick="quickAsk('Live football match scores today')">⚽ Live football scores</button>
              <button class="suggestion-btn" onclick="quickAsk('Top AI breakthroughs this week')">🤖 Top AI breakthroughs</button>
            </div>
          </div>
        `;
        return;
      }

      session.messages.forEach(m => {
        appendMessageElement(m.role, m.text, m.sources || [], false, m.isSports || false);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function quickAsk(text) {
      promptInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatBasicMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>")
        .replace(/`([^`]+)`/g, "<code style='background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:5px;'>$1</code>");
    }

    function typeWriterEffect(element, fullText, speed = 8) {
      return new Promise(resolve => {
        let index = 0;
        element.classList.add("typing-cursor");

        function step() {
          const chunk = Math.max(3, Math.ceil(fullText.length / 180));
          index = Math.min(index + chunk, fullText.length);
          element.innerHTML = formatBasicMarkdown(fullText.slice(0, index));
          chat.scrollTop = chat.scrollHeight;

          if (index < fullText.length) {
            setTimeout(step, speed);
          } else {
            element.classList.remove("typing-cursor");
            element.innerHTML = formatBasicMarkdown(fullText);
            chat.scrollTop = chat.scrollHeight;
            resolve();
          }
        }
        step();
      });
    }

    async function appendMessageElement(role, text, sources = [], animate = false, isSports = false) {
      const welcome = document.getElementById("welcomeScreen");
      if (welcome) welcome.remove();

      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;

      if (role === "ai" && sources.length > 0) {
        const srcTitle = document.createElement("div");
        srcTitle.className = "sources-title" + (isSports ? " sports-badge" : "");
        srcTitle.textContent = isSports
          ? `Live Flashscore Matches (${sources.length})`
          : `Web Sources (${sources.length})`;
        wrapper.appendChild(srcTitle);

        const grid = document.createElement("div");
        grid.className = "sources-grid";

        sources.forEach(s => {
          let subLabel = s.sub || "";
          if (!subLabel) {
            try { subLabel = new URL(s.url).hostname.replace("www.", ""); } catch { subLabel = "web"; }
          }
          const card = document.createElement("a");
          card.className = "source-card";
          card.href = s.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.innerHTML = `
            <div class="source-domain">${escapeHtml(subLabel)}</div>
            <div class="source-name">${escapeHtml(s.name || s.url)}</div>
          `;
          grid.appendChild(card);
        });
        wrapper.appendChild(grid);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);

      if (animate && role === "ai") {
        await typeWriterEffect(bubble, text);
      } else {
        bubble.innerHTML = formatBasicMarkdown(text);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function createStatus(text) {
      const welcome = document.getElementById("welcomeScreen");
      if (welcome) welcome.remove();
      const el = document.createElement("div");
      el.className = "status";
      el.innerHTML = `<div class="spinner"></div><span>${escapeHtml(text)}</span>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    // Detect ANY sports-related question automatically
    function detectSportsQuery(query) {
      if (sportsMode) return true;
      return /\b(cricket|football|soccer|ipl|t20|odi|test|score|scores|scorecard|match|matches|fixture|fixtures|standings|points table|premier league|la liga|serie a|bundesliga|champions league|uefa|fifa|world cup|bbl|psl|bpl|cricbuzz|flashscore|espncricinfo|tennis|atp|wta|basketball|nba|hockey|f1|formula 1|kabaddi|pkl|badminton|golf|ufc|boxing|vs|versus|batting|bowling|wickets|innings|goals|halftime|fulltime)\b/i.test(query);
    }

    function detectSportType(query) {
      const q = query.toLowerCase();
      if (/\b(football|soccer|premier league|la liga|serie a|bundesliga|champions league|uefa|fifa|goals|halftime|arsenal|liverpool|chelsea|manchester|real madrid|barcelona|bayern|psg|juventus|inter|milan)\b/.test(q)) {
        return "football";
      }
      if (/\b(tennis|atp|wta|grand slam|wimbledon|us open|french open|australian open)\b/.test(q)) {
        return "tennis";
      }
      if (/\b(basketball|nba|euroleague|lakers|warriors|celtics)\b/.test(q)) {
        return "basketball";
      }
      if (/\b(hockey|nhl)\b/.test(q)) {
        return "hockey";
      }
      if (/\b(badminton|bwf)\b/.test(q)) {
        return "badminton";
      }
      // Default to cricket (most common for India/IPL/T20/ODI/Test queries)
      return "cricket";
    }

    // Fetch Live Sports via Omkar Flashscore Scraper API
    async function fetchFlashscoreMatches(userQuery) {
      const sport = detectSportType(userQuery);
      const headers = {
        "API-Key": FLASHSCORE_API_KEY,
        "Accept": "application/json"
      };

      // 1. Try live matches first
      let res = await fetch(`${FLASHSCORE_BASE_URL}/matches?sport=${sport}&day=0&status=live`, { headers });
      let data = res.ok ? await res.json() : null;

      // 2. If no live matches at this exact moment, get all today's matches (live + finished + upcoming)
      if (!data || !data.match_count || data.match_count === 0) {
        res = await fetch(`${FLASHSCORE_BASE_URL}/matches?sport=${sport}&day=0`, { headers });
        if (!res.ok) {
          const errTxt = await res.text();
          throw new Error(`Flashscore API error (${res.status}): ${errTxt}`);
        }
        data = await res.json();
      }

      const competitions = data?.competitions || [];
      const stopWords = new Set(["live", "score", "scores", "scorecard", "match", "matches", "today", "cricket", "football", "what", "the", "and", "for", "update", "updates", "latest"]);
      const keywords = userQuery
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, "")
        .split(/\s+/)
        .filter(w => w.length > 2 && !stopWords.has(w));

      const matches = [];

      for (const compBlock of competitions) {
        const compName = compBlock.competition?.display_name || compBlock.competition?.name || sport.toUpperCase();
        const compLink = compBlock.competition?.link || "https://www.flashscore.com/";

        for (const m of (compBlock.matches || [])) {
          const home = m.home?.name || "Home";
          const away = m.away?.name || "Away";
          const hScore = m.home_score !== null && m.home_score !== undefined ? m.home_score : "-";
          const aScore = m.away_score !== null && m.away_score !== undefined ? m.away_score : "-";
          const stage = m.stage || m.status || "Scheduled";
          const timeInfo = m.start_time ? ` | Time: ${m.start_time}` : "";

          // Extra period/innings scores if available
          let periodDetails = "";
          if (m.home_period_scores && m.away_period_scores) {
            periodDetails = ` | Period/Innings: Home [${JSON.stringify(m.home_period_scores)}] vs Away [${JSON.stringify(m.away_period_scores)}]`;
          }

          const line = `• **${home} (${hScore}) vs ${away} (${aScore})** — *${compName}* | Status: **${stage}**${timeInfo}${periodDetails}`;
          const searchBlob = `${compName} ${home} ${away} ${stage}`.toLowerCase();

          const priority = keywords.some(k => searchBlob.includes(k)) ? 1 : 0;

          matches.push({
            priority,
            name: `${home} ${hScore} - ${aScore} ${away}`,
            sub: `${compName} • ${stage}`,
            url: m.link || compLink,
            text: line
          });
        }
      }

      matches.sort((a, b) => b.priority - a.priority);
      return { sport, matches: matches.slice(0, 15) };
    }

    // Fetch General Web Results via LangSearch API
    async function searchLangSearch(query) {
      const payload = {
        query,
        count: 6,
        contents: {
          text: { max_characters: 2800 }
        }
      };

      if (freshnessSelect.value) {
        payload.freshness = freshnessSelect.value;
      }

      const res = await fetch(LANGSEARCH_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${LANGSEARCH_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`LangSearch API error (${res.status}): ${errText}`);
      }

      const data = await res.json();
      return data?.data?.webPages?.value || [];
    }

    // Synthesize Final Answer
    async function generateGroundedAnswer(userQuery, results, isSports, sportName = "") {
      if (!results.length) {
        if (isSports) {
          return `No live or scheduled **${sportName}** matches were returned right now on Flashscore. Try asking about another sport (e.g., football, cricket, tennis) or toggle off **Live Sports** for general web news.`;
        }
        return "No live web results were found for that query. Try switching the time filter to **Any Time**.";
      }

      const context = results.map((r, i) => {
        const body = (r.text || r.snippet || "").replace(/\s+/g, " ").trim().slice(0, 900);
        return `[${i + 1}] ${r.name}: ${body}`;
      }).join("\n");

      const systemPrompt = isSports
        ? "You are Nexus AI, a live sports scoreboard assistant. Present the exact match scores, competition names, match status (live/finished/scheduled), and key details from the provided Flashscore data. Use clean bullet points and **bold** team names and scores. Never cut off mid-sentence."
        : "You are Nexus AI, a live web search assistant. Answer the user's question clearly and completely using ONLY the provided search results. Format with clean bullet points and **bold** highlights. Never cut off mid-sentence.";

      // Attempt 1: Pollinations OpenAI-compatible POST endpoint
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        const res = await fetch("https://text.pollinations.ai/openai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            model: "openai",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: `Question: ${userQuery}\n\nLive Data:\n${context}` }
            ]
          })
        });
        clearTimeout(timer);

        if (res.ok) {
          const json = await res.json();
          const reply = json?.choices?.[0]?.message?.content?.trim();
          if (reply) return reply;
        }
      } catch (_) {}

      // Attempt 2: Pollinations GET endpoint
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 13000);
        const shortPrompt = `${systemPrompt}\n\nQuestion: ${userQuery}\n\nData:\n${context.slice(0, 2200)}`;
        const getRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(shortPrompt)}`, {
          signal: controller.signal
        });
        clearTimeout(timer);
        if (getRes.ok) {
          const text = (await getRes.text()).trim();
          if (text && !text.startsWith("<!DOCTYPE") && !text.startsWith("{")) return text;
        }
      } catch (_) {}

      // Attempt 3: Direct clean output (already formatted cleanly for Flashscore & LangSearch)
      if (isSports) {
        return `**Live & Today's ${sportName.toUpperCase()} Matches (Flashscore):**\n\n` +
          results.map(r => r.text).join("\n\n");
      }

      return `**Live Web Results for "${userQuery}":**\n\n` +
        results.slice(0, 5).map(r => {
          const clean = (r.snippet || r.text || "").replace(/\s+/g, " ").trim();
          return `• **${r.name}**\n  ${clean}`;
        }).join("\n\n");
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = promptInput.value.trim();
      if (!query) return;

      let session = getCurrentSession();
      if (!session) {
        session = createNewSession(query);
      } else if (session.messages.length === 0) {
        session.title = query.slice(0, 42);
      }

      promptInput.value = "";
      sendBtn.disabled = true;

      session.messages.push({ role: "user", text: query });
      session.updatedAt = Date.now();
      saveSessions();
      renderSidebar();
      await appendMessageElement("user", query, [], false);

      const isSports = detectSportsQuery(query);
      const statusEl = createStatus(
        isSports
          ? "Fetching live scores via Flashscore API..."
          : "Searching live web via LangSearch..."
      );

      try {
        let results = [];
        let sportName = "";

        if (isSports) {
          const sportsData = await fetchFlashscoreMatches(query);
          sportName = sportsData.sport;
          results = sportsData.matches;
        } else {
          results = await searchLangSearch(query);
        }

        statusEl.querySelector("span").textContent = `Formatting ${results.length} live results...`;
        const answer = await generateGroundedAnswer(query, results, isSports, sportName);
        statusEl.remove();

        const slimSources = results.map(r => ({
          name: r.name,
          url: r.url,
          sub: r.sub || ""
        }));

        session.messages.push({ role: "ai", text: answer, sources: slimSources, isSports });
        session.updatedAt = Date.now();
        saveSessions();
        renderSidebar();

        await appendMessageElement("ai", answer, slimSources, true, isSports);
      } catch (err) {
        statusEl.remove();
        const errorMsg = `⚠️ **Request Failed:** ${err.message}`;
        session.messages.push({ role: "ai", text: errorMsg, sources: [] });
        saveSessions();
        await appendMessageElement("ai", errorMsg, [], true);
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });

    renderSidebar();
    renderActiveChat();
  </script>
