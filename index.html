<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI — Live Web, Code & Sports Intelligence</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-sidebar: #0e1422;
      --bg-card: #131b2e;
      --bg-input: #172036;
      --border: #24304d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-btn: #2563eb;
      --green: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .new-chat-btn {
      background: var(--accent-btn);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .new-chat-btn:hover { background: #1d4ed8; }
    .saved-header {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.84rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 6px;
    }
    .chat-item.active { border-color: var(--accent); }
    .chat-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .del-btn:hover { color: #f87171; }
    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .clear-btn:hover { border-color: #f87171; color: #f87171; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-sidebar);
    }
    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    select {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.83rem;
      cursor: pointer;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 15px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.94rem;
    }
    .msg.user {
      background: #1e293b;
      border: 1px solid #334155;
      align-self: flex-end;
    }
    .msg.ai {
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .engine-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .engine-sports {
      background: rgba(74, 222, 128, 0.14);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.35);
    }
    .engine-web {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .sources-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .source-chip {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-btn {
      margin-top: 10px;
      background: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .copy-btn:hover { color: #fff; border-color: var(--accent); }

    .input-area {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-sidebar);
    }
    .input-wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .ask-btn {
      background: var(--accent-btn);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    pre {
      background: #0b1120;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    @media (max-width: 760px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div class="saved-header">
      <span>SAVED CHATS</span>
      <span id="chatCount">0</span>
    </div>
    <div id="chatList" class="chat-list"></div>
    <button class="clear-btn" onclick="clearAllHistory()">Clear All History</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="brand">
        <span>Nexus AI</span>
        <span class="badge">🏏 Live Sports + Web</span>
      </div>
      <div class="controls">
        <select id="sportFilter">
          <option value="auto">(Auto Sport)</option>
          <option value="Cricket">Cricket</option>
          <option value="Football">Football</option>
          <option value="Tennis">Tennis</option>
          <option value="Basketball">Basketball</option>
          <option value="Hockey">Hockey</option>
          <option value="Badminton">Badminton</option>
        </select>
        <select id="timeFilter">
          <option value="noLimit">(Any Time)</option>
          <option value="oneDay">Past 24 Hours</option>
          <option value="oneWeek">Past Week</option>
          <option value="oneMonth">Past Month</option>
        </select>
      </div>
    </header>

    <section id="messages" class="messages"></section>

    <footer class="input-area">
      <div class="input-wrap">
        <input id="promptInput" type="text" placeholder="Ask about live scores, wickets, overs, code, or anything on the web..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="askBtn" class="ask-btn" onclick="sendMessage()">Ask AI</button>
      </div>
    </footer>
  </main>

  <script>
    // =========================================================================
    // ALL API KEYS SAVED DIRECTLY IN CODE (NO UI MODAL)
    // =========================================================================
    // Your Gemini API Key (used ONLY for sports queries):
    const GEMINI_API_KEY = "AQ.Ab8RN6KXZgBocqKVptoWh9QKJgG0nxsZeb6vPD9Vee69q6wJPA";

    // Your New LangSearch API Key (used for all general web searches & live sports context):
    const LANGSEARCH_API_KEY = "sk-0bb3ddb745e441e987b37b972096f3e0";

    // Your Custom Render Cricket-API + Key:
    const CRICKET_API_BASE = "https://cricket-api-1-hmcw.onrender.com";
    const CRICKET_API_KEY = "ck_live_nexus_2026";
    // =========================================================================

    let chats = JSON.parse(localStorage.getItem("nexus_chats_v4") || "[]");
    let currentChatId = null;

    // 1. Detect if the prompt is Sports-related (handles typos like "sprts" too)
    function isSportsQuery(text) {
      const selectedSport = document.getElementById("sportFilter").value;
      if (selectedSport !== "auto") return true;

      const sportsRegex = /\b(sport|sports|sprts|cricket|ipl|t20|t20i|odi|test match|sheffield shield|big bash|bbl|psl|cpl|world cup|ashes|wicket|wickets|overs|runs|runs needed|target|batting|bowling|scorecard|innings|kohli|rohit|bumrah|dhoni|gill|hardik|suryakumar|pant|jadeja|babar|root|smith|cummins|starc|williamson|football|soccer|premier league|epl|laliga|bundesliga|serie a|ligue 1|champions league|ucl|isl|messi|ronaldo|mbappe|haaland|goal|goals|lineup|lineups|fixture|fixtures|live score|live scores|match score|standings|points table|tennis|atp|wta|grand slam|wimbledon|nba|basketball|hockey|badminton|bwf)\b/i;
      return sportsRegex.test(text);
    }

    // 2. Sports Handler -> Uses Gemini API Key + Render Cricket-API + LangSearch Live Sports
    async function handleSportsQuery(userPrompt) {
      const sportChoice = document.getElementById("sportFilter").value;
      let renderMatches = [];
      let webSources = [];
      let webSnippets = "";

      // Step A: Pull live cricket matches from your Render Cricket-API
      try {
        const res = await fetch(`${CRICKET_API_BASE}/live`, {
          headers: { "X-API-Key": CRICKET_API_KEY }
        });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) renderMatches = data.slice(0, 12);
        }
      } catch (e) {
        console.warn("Render API waking up:", e);
      }

      // Step B: Pull fresh live sports search context via LangSearch
      try {
        const lsRes = await fetch("https://api.langsearch.com/v1/web-search", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${LANGSEARCH_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            query: `${sportChoice !== "auto" ? sportChoice + " " : ""}${userPrompt} live score scorecard`,
            freshness: "oneDay",
            summary: true,
            count: 5
          })
        });
        if (lsRes.ok) {
          const lsData = await lsRes.json();
          const pages = lsData?.data?.webPages?.value || lsData?.webPages?.value || [];
          webSources = pages.slice(0, 4).map(p => ({ title: p.name || "Live Source", url: p.url }));
          webSnippets = pages.slice(0, 4).map(p => `• **${p.name}**: ${p.summary || p.snippet || ""}`).join("\n");
        }
      } catch (e) {
        console.warn("LangSearch sports lookup error:", e);
      }

      // Step C: Call Gemini API ONLY for sports queries (with Google Search grounding)
      if (GEMINI_API_KEY) {
        try {
          const geminiRes = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                tools: [{ google_search: {} }],
                contents: [{
                  parts: [{
                    text: `You are Nexus AI's Live Sports Analyst. Date: ${new Date().toDateString()}.\nProvide exact live scores, wickets, overs, batting & bowling stats, and match status.\n\nRender Live Cricket Feed:\n${renderMatches.join("\n")}\n\nWeb Sports Context:\n${webSnippets}\n\nUser Question: ${userPrompt}`
                  }]
                }]
              })
            }
          );

          if (geminiRes.ok) {
            const gData = await geminiRes.json();
            const gText = gData?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("\n");
            const groundingChunks = gData?.candidates?.[0]?.groundingMetadata?.groundingChunks || [];
            const gSources = groundingChunks
              .filter(c => c.web && c.web.uri)
              .map(c => ({ title: c.web.title || "Live Sports Source", url: c.web.uri }))
              .slice(0, 4);

            if (gText) {
              return {
                engine: "Gemini Sports AI + Render Cricket API",
                isSports: true,
                text: gText,
                sources: gSources.length ? gSources : webSources
              };
            }
          }
        } catch (e) {
          console.warn("Gemini fallback triggered:", e);
        }
      }

      // Step D: Seamless fallback combining your Render Cricket-API + LangSearch Live Sports
      let output = "";
      if (renderMatches.length > 0) {
        output += "**Live Cricket Matches (Render API Feed):**\n" + renderMatches.map(m => `• ${m}`).join("\n") + "\n\n";
      }
      if (webSnippets) {
        output += "**Latest Match Updates & Scorecards:**\n" + webSnippets;
      }
      if (!output) {
        output = "No live matches found right now. Try asking about a specific team or tournament.";
      }

      return {
        engine: "Live Sports Engine (Render Cricket API + LangSearch)",
        isSports: true,
        text: output,
        sources: webSources
      };
    }

    // 3. General Web & Code Handler -> Uses LangSearch API ONLY (0 Gemini calls)
    async function handleGeneralQuery(userPrompt) {
      const freshness = document.getElementById("timeFilter").value;

      try {
        const res = await fetch("https://api.langsearch.com/v1/web-search", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${LANGSEARCH_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            query: userPrompt,
            freshness: freshness,
            summary: true,
            count: 5
          })
        });

        const data = await res.json();
        if (res.ok) {
          const webPages = data?.data?.webPages?.value || data?.webPages?.value || [];
          const sources = webPages.slice(0, 4).map(p => ({
            title: p.name || p.title || "Web Result",
            url: p.url
          }));

          const formatted = webPages.length === 0
            ? "No web results found for your query."
            : webPages.slice(0, 4).map((item, idx) => {
                const snippet = item.summary || item.snippet || "";
                return `**${idx + 1}. ${item.name || "Result"}**\n${snippet}`;
              }).join("\n\n");

          return {
            engine: "LangSearch Web Intelligence",
            isSports: false,
            text: formatted,
            sources
          };
        }
      } catch (e) {
        console.warn("LangSearch error, falling back to Wikipedia:", e);
      }

      // Free Wikipedia fallback for conversational/factual queries
      const wikiRes = await fetch(
        `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(userPrompt)}&format=json&origin=*`
      );
      const wikiData = await wikiRes.json();
      const hits = wikiData?.query?.search || [];
      if (hits.length > 0) {
        const cleanText = hits.slice(0, 3).map((h, i) => {
          const plain = h.snippet.replace(/<[^>]*>/g, "");
          return `**${i + 1}. ${h.title}**\n${plain}...`;
        }).join("\n\n");
        return {
          engine: "Wikipedia Knowledge Fallback",
          isSports: false,
          text: cleanText,
          sources: hits.slice(0, 3).map(h => ({
            title: h.title,
            url: `https://en.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g, "_"))}`
          }))
        };
      }

      return {
        engine: "Nexus AI",
        isSports: false,
        text: "Hello! Ask me anything about live sports scores, coding, or web topics.",
        sources: []
      };
    }

    function formatMarkdown(text) {
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\n/g, "<br>");
      return html;
    }

    function saveChats() {
      localStorage.setItem("nexus_chats_v4", JSON.stringify(chats));
      renderSidebar();
    }

    function createNewChat() {
      const id = Date.now().toString();
      chats.unshift({ id, title: "New Conversation", messages: [] });
      currentChatId = id;
      saveChats();
      renderMessages();
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) {
        currentChatId = chats[0]?.id || null;
      }
      saveChats();
      renderMessages();
    }

    function clearAllHistory() {
      chats = [];
      currentChatId = null;
      saveChats();
      renderMessages();
    }

    function renderSidebar() {
      const list = document.getElementById("chatList");
      document.getElementById("chatCount").textContent = chats.length;
      list.innerHTML = "";
      chats.forEach(c => {
        const div = document.createElement("div");
        div.className = "chat-item" + (c.id === currentChatId ? " active" : "");
        div.onclick = () => { currentChatId = c.id; renderSidebar(); renderMessages(); };
        div.innerHTML = `<span class="chat-title">${c.title}</span><button class="del-btn" onclick="deleteChat('${c.id}', event)">🗑</button>`;
        list.appendChild(div);
      });
    }

    function renderMessages() {
      const box = document.getElementById("messages");
      box.innerHTML = "";
      const active = chats.find(c => c.id === currentChatId);
      if (!active || active.messages.length === 0) {
        box.innerHTML = `
          <div class="msg ai">
            <strong>Welcome to Nexus AI</strong><br>
            Ask about <strong>live cricket scores, wickets, overs, football matches</strong>, or any general web topic.
          </div>`;
        return;
      }

      active.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        if (m.role === "user") {
          div.textContent = m.text;
        } else {
          const badgeClass = m.isSports ? "engine-sports" : "engine-web";
          const sourcesHtml = (m.sources && m.sources.length)
            ? `<div class="sources-box">${m.sources.map(s => `<a class="source-chip" href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`).join("")}</div>`
            : "";
          div.innerHTML = `
            <span class="engine-tag ${badgeClass}">${m.engine || "Nexus AI"}</span>
            ${sourcesHtml}
            <div>${formatMarkdown(m.text)}</div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.innerText)">Copy Answer</button>
          `;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("promptInput");
      const btn = document.getElementById("askBtn");
      const promptText = input.value.trim();
      if (!promptText) return;

      if (!currentChatId) createNewChat();
      const active = chats.find(c => c.id === currentChatId);
      if (active.messages.length === 0) {
        active.title = promptText.slice(0, 42);
      }

      active.messages.push({ role: "user", text: promptText });
      input.value = "";
      btn.disabled = true;
      saveChats();
      renderMessages();

      const sportsMode = isSportsQuery(promptText);
      active.messages.push({
        role: "ai",
        isSports: sportsMode,
        engine: sportsMode ? "Fetching Live Sports..." : "Searching Web...",
        text: "⏳ Loading real-time results...",
        sources: []
      });
      renderMessages();

      try {
        const result = sportsMode
          ? await handleSportsQuery(promptText)
          : await handleGeneralQuery(promptText);

        active.messages[active.messages.length - 1] = {
          role: "ai",
          isSports: result.isSports,
          engine: result.engine,
          text: result.text,
          sources: result.sources
        };
      } catch (err) {
        active.messages[active.messages.length - 1] = {
          role: "ai",
          isSports: sportsMode,
          engine: "API Notice",
          text: `❌ ${err.message}`,
          sources: []
        };
      }

      btn.disabled = false;
      saveChats();
      renderMessages();
    }

    if (chats.length > 0) currentChatId = chats[0].id;
    renderSidebar();
    renderMessages();
  </script>
</body>
</html>
