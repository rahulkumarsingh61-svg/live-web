<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI — Live Web Search Assistant</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(17, 24, 39, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
      --ai-bubble: rgba(30, 41, 59, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, var(--bg) 45%, #05080f 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, .pill-toggle {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }

    select:hover, .pill-toggle:hover {
      border-color: var(--accent);
    }

    .pill-toggle.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Chat Container */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 560px;
      padding: 24px;
    }

    .welcome h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .suggestion-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Messages */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; width: 100%; max-width: 820px; }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
    }

    .msg.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
    }

    /* Sources Strip */
    .sources-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .sources-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .source-card {
      min-width: 190px;
      max-width: 220px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text);
      transition: 0.2s;
      flex-shrink: 0;
    }

    .source-card:hover {
      border-color: var(--accent);
      background: rgba(30, 41, 59, 0.95);
    }

    .source-domain {
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-name {
      font-size: 0.8rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* Status Indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 0.86rem;
      padding: 8px 12px;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input Bar */
    .input-area {
      padding: 14px 16px 20px;
      background: linear-gradient(to top, rgba(9, 13, 22, 0.98), rgba(9, 13, 22, 0.7));
    }

    .input-box {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 8px 10px 8px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.96rem;
      outline: none;
    }

    button#sendBtn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button#sendBtn:hover { opacity: 0.92; transform: scale(1.02); }
    button#sendBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-dot"></div>
      <span>Nexus AI</span>
    </div>
    <div class="controls">
      <button id="sportsToggle" class="pill-toggle" title="Focus on ESPNcricinfo, Cricbuzz & ESPN">🏏 Live Sports Mode</button>
      <select id="freshnessSelect" title="Search Recency">
        <option value="">Any Time</option>
        <option value="oneDay" selected>Past 24 Hours</option>
        <option value="oneWeek">Past Week</option>
        <option value="oneMonth">Past Month</option>
      </select>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcomeScreen">
      <h1>Ask Anything, Grounded Live</h1>
      <p>Powered by LangSearch Web Search API &amp; real-time AI synthesis. Toggle <strong>Live Sports Mode</strong> for match updates or ask any question.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="quickAsk('Latest India cricket match score and highlights')">🏏 Latest India cricket score</button>
        <button class="suggestion-btn" onclick="quickAsk('Top AI breakthroughs this week')">🤖 Top AI breakthroughs this week</button>
        <button class="suggestion-btn" onclick="quickAsk('Latest Premier League football standings and results')">⚽ Premier League results</button>
      </div>
    </div>
  </main>

  <div class="input-area">
    <form class="input-box" id="chatForm">
      <input type="text" id="promptInput" placeholder="Ask about live matches, news, or anything on the web..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Ask AI</button>
    </form>
  </div>

  <script>
    const LANGSEARCH_API_KEY = "sk-8312c802939e459ba348814af35a41b3";
    const LANGSEARCH_URL = "https://api.langsearch.com/v1/web-search";

    const chat = document.getElementById("chat");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const freshnessSelect = document.getElementById("freshnessSelect");
    const sportsToggle = document.getElementById("sportsToggle");
    const welcomeScreen = document.getElementById("welcomeScreen");

    let sportsMode = false;

    sportsToggle.addEventListener("click", () => {
      sportsMode = !sportsMode;
      sportsToggle.classList.toggle("active", sportsMode);
      if (sportsMode) freshnessSelect.value = "oneDay";
    });

    function quickAsk(text) {
      promptInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    function appendMessage(role, text, sources = []) {
      if (welcomeScreen) welcomeScreen.style.display = "none";

      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;

      if (role === "ai" && sources.length > 0) {
        const srcTitle = document.createElement("div");
        srcTitle.className = "sources-title";
        srcTitle.textContent = `Sources (${sources.length})`;
        wrapper.appendChild(srcTitle);

        const grid = document.createElement("div");
        grid.className = "sources-grid";

        sources.forEach(s => {
          let domain = "";
          try { domain = new URL(s.url).hostname.replace("www.", ""); } catch { domain = "web"; }
          const card = document.createElement("a");
          card.className = "source-card";
          card.href = s.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.innerHTML = `
            <div class="source-domain">${escapeHtml(domain)}</div>
            <div class="source-name">${escapeHtml(s.name || s.url)}</div>
          `;
          grid.appendChild(card);
        });
        wrapper.appendChild(grid);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = formatBasicMarkdown(escapeHtml(text));
      wrapper.appendChild(bubble);

      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
    }

    function createStatus(text) {
      if (welcomeScreen) welcomeScreen.style.display = "none";
      const el = document.createElement("div");
      el.className = "status";
      el.innerHTML = `<div class="spinner"></div><span>${escapeHtml(text)}</span>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatBasicMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code style='background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:5px;'>$1</code>");
    }

    async function searchLangSearch(query) {
      const payload = {
        query: query,
        count: 5,
        contents: {
          text: { max_characters: 2500 }
        }
      };

      if (freshnessSelect.value) {
        payload.freshness = freshnessSelect.value;
      }

      if (sportsMode) {
        payload.includeDomains = ["espncricinfo.com", "cricbuzz.com", "espn.com", "bbc.com"];
      }

      const res = await fetch(LANGSEARCH_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${LANGSEARCH_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`LangSearch API error (${res.status}): ${errText}`);
      }

      const data = await res.json();
      return data?.data?.webPages?.value || [];
    }

    async function generateGroundedAnswer(userQuery, results) {
      if (!results.length) {
        return "No live web results were found for that query. Try switching freshness to 'Any Time' or turning off Live Sports Mode.";
      }

      const context = results.map((r, i) => {
        const body = r.text || r.snippet || "";
        return `[${i + 1}] Title: ${r.name}\nURL: ${r.url}\nContent: ${body}`;
      }).join("\n\n---\n\n");

      const systemPrompt =
        "You are Nexus AI, a sharp, accurate research assistant. Answer the user's question using ONLY the provided live web search results. " +
        "If the user asks for a score or facts not clearly present in the sources, say what is available and note what is missing. Keep formatting clean with bullet points and bold key stats.";

      const fullPrompt = `${systemPrompt}\n\nWEB SEARCH RESULTS:\n${context}\n\nUSER QUESTION: ${userQuery}`;

      // Free keyless AI synthesis endpoint
      const aiRes = await fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: `WEB SEARCH RESULTS:\n${context}\n\nUSER QUESTION: ${userQuery}` }
          ],
          model: "openai"
        })
      });

      if (!aiRes.ok) {
        // Fallback: return clean search summaries directly if LLM endpoint is busy
        return results.map(r => `• **${r.name}**\n  ${r.snippet || (r.text || "").slice(0, 220)}...`).join("\n\n");
      }

      return await aiRes.text();
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = promptInput.value.trim();
      if (!query) return;

      promptInput.value = "";
      sendBtn.disabled = true;
      appendMessage("user", query);

      const statusEl = createStatus("Searching live web via LangSearch...");

      try {
        const results = await searchLangSearch(query);
        statusEl.querySelector("span").textContent = `Reading ${results.length} sources & generating answer...`;
        const answer = await generateGroundedAnswer(query, results);
        statusEl.remove();
        appendMessage("ai", answer, results);
      } catch (err) {
        statusEl.remove();
        appendMessage(
          "ai",
          `⚠️ **Request Failed:** ${err.message}\n\n` +
          `If you opened this file directly via \`file:///\`, your browser's CORS security policy may block direct calls to \`api.langsearch.com\`. ` +
          `To fix that, route requests through a local Python Flask proxy or a Cloudflare Worker.`
        );
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
